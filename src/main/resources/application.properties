spring.application.name=Employee Performance Monitoring

# --- database ---------------------------------------------------------
# NOTE: Spring Boot 4.0 renamed this from spring.data.mongodb.uri
spring.mongodb.uri=${MONGO_URI}
# builds the unique index on users.email at startup
spring.data.mongodb.auto-index-creation=true

# --- server -----------------------------------------------------------
server.port=${PORT:8080}
server.servlet.context-path=/

# --- auth -------------------------------------------------------------
# Override JWT_SECRET in production. Must be at least 32 characters.
app.jwt.secret=${JWT_SECRET:local-dev-only-secret-change-me-please-32}
app.jwt.expiry-minutes=${JWT_EXPIRY_MINUTES:720}

# --- cors -------------------------------------------------------------
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,https://employee-performance-9y66.onrender.com}

# --- ai ---------------------------------------------------------------
# Leave AI_API_KEY unset to fall back to the built-in rule-based analysis.
ai.api.key=${AI_API_KEY:}
ai.base-url=${AI_BASE_URL:https://api.groq.com/openai/v1/chat/completions}
ai.model=${AI_MODEL:llama-3.3-70b-versatile}
